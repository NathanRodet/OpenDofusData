[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-dofus-data"
dynamic = ["version"]
description = "Passive capture of Dofus 3 packets into a local SQLite database."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["scapy>=2.6,<3", "customtkinter>=6.0.0,<7"]

[project.scripts]
opendofusdata = "opendofusdata.cli:main"

[tool.setuptools.dynamic]
version = {attr = "opendofusdata.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
