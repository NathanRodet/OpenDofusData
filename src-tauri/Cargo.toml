[package]
name = "open-dofus-data-client"
version = "2.4.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "2.4.1"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
proptest = "1"
odd-core = { path = "crates/odd-core" }
odd-wire = { path = "crates/odd-wire" }
odd-decode = { path = "crates/odd-decode" }
odd-agent = { path = "crates/odd-agent" }
odd-capture = { path = "crates/odd-capture" }
odd-tcp = { path = "crates/odd-tcp" }
etherparse = "0.21"
pcap = "2.5"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
axum = "0.8"
odd-sync = { path = "crates/odd-sync" }
odd-service = { path = "crates/odd-service" }
odd-update = { path = "crates/odd-update" }
odd-reference = { path = "crates/odd-reference" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[lints]
workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "open_dofus_data_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
odd-service.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
