name: Release

# A tag `vX.Y.Z` builds the installer and publishes it with its SHA-256 as a GitHub release.
# The application reads this release to offer the update (`open-dofus-data_vX.Y.Z_setup.exe` and its `.sha256`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: The tag matches the version of the application
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $config = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($config -ne $version -or $cargo -ne $version) { throw "tag $version, tauri.conf.json $config, Cargo.toml $cargo" }
      - name: Npcap SDK (import library of the capture worker)
        run: ./scripts/fetch-npcap-sdk.ps1
        shell: pwsh
      - run: npm ci
      - name: Capture worker (Tauri needs it in src-tauri/binaries before any build)
        run: npm run worker
      - run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace --all-features
      - name: Installer
        run: npm run tauri build
      - name: Name the installer and write its SHA-256
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $built = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $name = "open-dofus-data_v${version}_setup.exe"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $built.FullName "release/$name"
          $hash = (Get-FileHash -Algorithm SHA256 "release/$name").Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii "release/$name.sha256"
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --title "${{ github.ref_name }}" --generate-notes
